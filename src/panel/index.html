<!--
  Panel markup. The build inlines styles.css and the bundled script at the two
  placeholders below: Orca's panel CSP blocks every external file.
  Orca prepends its own <!doctype>/<html>/<head> shell, so start at <body>.
  Icons are inline Lucide SVGs (Orca's own icon set).
-->
<!-- @inline-styles -->
<body>
  <header class="header">
    <div class="header-text">
      <h3>Saved Prompts</h3>
      <p id="summary" class="muted"></p>
    </div>
    <button id="new-prompt" class="icon-button" title="Nuevo prompt" aria-label="Nuevo prompt">
      <svg viewBox="0 0 24 24"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
    </button>
    <button id="edit-prompts" class="icon-button" title="Configuración: abrir prompts.json" aria-label="Configuración: abrir prompts.json">
      <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg>
    </button>
    <button id="refresh" class="icon-button" title="Refrescar" aria-label="Refrescar">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></svg>
    </button>
  </header>

  <label class="field">
    <svg viewBox="0 0 24 24"><path d="M3 6h18" /><path d="M7 12h10" /><path d="M10 18h4" /></svg>
    <input id="query" type="search" placeholder="Buscar prompts" aria-label="Buscar prompts" />
  </label>

  <script id="panel-data" type="application/json">{}</script>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty muted"></p>
  <p id="status" class="status" role="status"></p>
  <p class="hint muted">Nuevo o editar: ＋ / ⚙ arriba o paleta de comandos → <b>Saved Prompts</b></p>

  <div id="terminal-menu" class="menu" role="menu" aria-labelledby="terminal-menu-label" hidden>
    <div id="terminal-menu-label" class="menu-label">Enviar a:</div>
    <div id="terminal-menu-items"></div>
  </div>

  <template id="menu-item-template">
    <button class="menu-item" role="menuitem">
      <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5" /><line x1="12" x2="20" y1="19" y2="19" /></svg>
      <span class="menu-item-label"></span>
      <span class="menu-item-hint"></span>
    </button>
  </template>

  <template id="row-template">
    <li>
      <button class="row">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /><path d="M13 8H7" /><path d="M17 12H7" /></svg>
        <span class="row-text">
          <span class="row-title"></span>
          <span class="row-preview"></span>
        </span>
        <svg class="row-action" viewBox="0 0 24 24"><path d="M12 20h-1a2 2 0 0 1-2-2 2 2 0 0 1-2 2H6" /><path d="M13 8h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-7" /><path d="M5 16H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h1" /><path d="M6 4h1a2 2 0 0 1 2 2 2 2 0 0 1 2-2h1" /><path d="M9 6v12" /></svg>
      </button>
    </li>
  </template>
  <!-- @inline-script -->
</body>
